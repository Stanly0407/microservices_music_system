server:
  port: 8888

spring:
  application:
    name: config-server
  rabbitmq:
    host: "${RABBITMQ_HOST:localhost}"
    port: "${RABBITMQ_PORT:5672}"
    username: "${RABBITMQ_USER:guest}"
    password: "${RABBITMQ_PASSWORD:guest}"
  cloud:
    config:
      server:
        git:
          uri: "${CONFIG_SERVER_GIT_URI:https://github.com/Stanly0407/microservices-music-system-config.git}"
          default-label: main
          clone-on-start: true
          force-pull: true
          timeout: 10

eureka:
  client:
    service-url:
      defaultZone: "${EUREKA_SERVER_URL:http://localhost:8761/eureka}"
    registry-fetch-interval-seconds: 5
  instance:
    lease-renewal-interval-in-seconds: 5
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,busrefresh
