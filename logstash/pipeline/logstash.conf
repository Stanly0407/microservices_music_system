input {
  tcp {
    port => 5000
    codec => json_lines
  }
}

filter {
  if ![service] {
    mutate {
      add_field => { "service" => "unknown" }
    }
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    # "app-" prefix avoids colliding with Elasticsearch's built-in "logs-*-*"
    # data-stream template, which rejects plain index writes (op_type=index).
    index => "app-logs-%{[service]}-%{+YYYY.MM.dd}"
  }
}
