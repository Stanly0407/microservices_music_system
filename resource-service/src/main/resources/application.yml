server:
  port: 8081

spring:
  application:
    name: resource-service
  config:
    import: "optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}"
  datasource:
    url: "${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/resource-db}"
    username: "${SPRING_DATASOURCE_USERNAME:postgres}"
    password: "${SPRING_DATASOURCE_PASSWORD:postgres}"
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          lob:
            non_contextual_creation: true
  rabbitmq:
    host: "${RABBITMQ_HOST:localhost}"
    port: "${RABBITMQ_PORT:5672}"
    username: "${RABBITMQ_USER:guest}"
    password: "${RABBITMQ_PASSWORD:guest}"

eureka:
  client:
    service-url:
      defaultZone: "${EUREKA_SERVER_URL:http://localhost:8761/eureka}"
    registry-fetch-interval-seconds: 5
  instance:
    lease-renewal-interval-in-seconds: 5
    prefer-ip-address: true

cloud:
  aws:
    s3:
      endpoint: "${AWS_S3_ENDPOINT:http://localhost:4566}"
      bucket: "${AWS_S3_BUCKET:mp3-resources}"
    credentials:
      access-key: "${AWS_ACCESS_KEY:test}"
      secret-key: "${AWS_SECRET_KEY:test}"
    region: "${AWS_REGION:us-east-1}"

management:
  endpoints:
    web:
      exposure:
        include: health,refresh,info