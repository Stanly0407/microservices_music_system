server:
  port: 8081

spring:
  application:
    name: resource-service
  config:
    import: "optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}"
  datasource:
    url: "${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/resource-db}"
    username: "${SPRING_DATASOURCE_USERNAME:postgres}"
    password: "${SPRING_DATASOURCE_PASSWORD:postgres}"
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          lob:
            non_contextual_creation: true
  rabbitmq:
    host: "${RABBITMQ_HOST:localhost}"
    port: "${RABBITMQ_PORT:5672}"
    username: "${RABBITMQ_USER:guest}"
    password: "${RABBITMQ_PASSWORD:guest}"
    template:
      observation-enabled: true
    listener:
      simple:
        observation-enabled: true

eureka:
  client:
    service-url:
      defaultZone: "${EUREKA_SERVER_URL:http://localhost:8761/eureka}"
    registry-fetch-interval-seconds: 5
  instance:
    lease-renewal-interval-in-seconds: 5
    prefer-ip-address: true

cloud:
  aws:
    s3:
      endpoint: "${AWS_S3_ENDPOINT:http://localhost:4566}"
    credentials:
      access-key: "${AWS_ACCESS_KEY:test}"
      secret-key: "${AWS_SECRET_KEY:test}"
    region: "${AWS_REGION:us-east-1}"

keycloak:
  token-uri: "${KEYCLOAK_TOKEN_URI:http://keycloak:9090/realms/music-system/protocol/openid-connect/token}"

storage-service:
  client-id: "${STORAGE_SERVICE_CLIENT_ID:resource-service-client}"
  client-secret: "${STORAGE_SERVICE_CLIENT_SECRET:resource-service-secret}"

storage:
  stub:
    staging:
      bucket: "${STORAGE_STUB_STAGING_BUCKET:mp3-staging}"
      path: "${STORAGE_STUB_STAGING_PATH:/staging}"
    permanent:
      bucket: "${STORAGE_STUB_PERMANENT_BUCKET:mp3-permanent}"
      path: "${STORAGE_STUB_PERMANENT_PATH:/permanent}"

resilience4j:
  circuitbreaker:
    instances:
      storageService:
        register-health-indicator: true
        sliding-window-type: COUNT_BASED
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,refresh,busrefresh,info,circuitbreakers,circuitbreakerevents,prometheus,metrics
  health:
    circuitbreakers:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
  tracing:
    sampling:
      probability: 1.0