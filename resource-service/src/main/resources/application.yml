server:
  port: 8081

spring:
  application:
    name: resource-service
  sql:
    init:
      mode: never
  datasource:
    url: jdbc:postgresql://localhost:5433/resource_db
    username: resource_user
    password: resource_pass
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          lob:
            non_contextual_creation: true

song-service:
  base-url: http://localhost:8082
