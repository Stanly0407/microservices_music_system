server:
  port: 8082

spring:
  application:
    name: song-service
  sql:
    init:
      mode: never
  datasource:
    url: jdbc:postgresql://localhost:5433/song-db
    username: postgres
    password: postgres
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          lob:
            non_contextual_creation: true

resource-service:
  base-url: http://localhost:8081